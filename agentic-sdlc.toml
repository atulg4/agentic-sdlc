version = 1

[project]
id = "atulg4/agentic-sdlc"
provider = "github"
default_branch = "main"

[agents]
planner = "codex"
implementer = "codex"
reviewer = "codex"

[automation]
default_mode = "plan"
ready_label = "agent-ready"
human_review_label = "human-review-required"
implementation_label = "implementation-approved"

[policy]
human_merge_required = true
max_changed_files = 20
max_diff_lines = 2000
max_patch_bytes = 5000000
forbidden_paths = [
  ".github/**",
  ".github/workflows/**",
  ".gitlab-ci.yml",
  ".gitlab/**",
  "agentic-sdlc.toml",
  "CODEOWNERS",
  "**/CODEOWNERS",
  "AGENTS.md",
  "**/AGENTS.md",
  "CLAUDE.md",
  "**/CLAUDE.md",
  ".env*",
  "**/.env*",
  "*.pem",
  "**/*.pem",
  "*.key",
  "**/*.key",
]
protected_paths = ["src/auth/**", "migrations/**", "deployment/**"]
low_risk_paths = ["docs/**", "**/*.md"]
forbidden_task_patterns = [
  '\bdeploy\b.{0,40}\bprod',
  '\b(?:production|broker)\b.{0,40}\b(?:credential|password|token)',
  '\bdisable\b.{0,40}\b(?:auth|test|safety)',
]

[commands]

[verification]
gates = []
