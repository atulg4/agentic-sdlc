name: Automatic approved implementation

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  implement:
    if: >-
      github.event.label.name == 'implementation-approved' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'claude-ready') &&
      contains(github.event.issue.labels.*.name, 'human-review-required')
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: atulg4/agentic-sdlc/.github/workflows/reusable-implement.yml@PLATFORM_COMMIT_SHA
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: atulg4/agentic-sdlc
      publisher_app_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
      agent: codex
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
      PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
