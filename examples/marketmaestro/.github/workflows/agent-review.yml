name: Independent agent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_eligibility:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require same-repository non-draft pull request
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          test "$SAME_REPOSITORY" = "true"
          test "$IS_DRAFT" = "false"

  review_auth_preflight:
    needs: review_eligibility
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require Claude Max OAuth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: test -n "$CLAUDE_CODE_OAUTH_TOKEN"

  review:
    needs: review_auth_preflight
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: atulg4/agentic-sdlc/.github/workflows/reusable-review.yml@PLATFORM_COMMIT_SHA
    with:
      pull_request_number: ${{ format('{0}', github.event.pull_request.number) }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
