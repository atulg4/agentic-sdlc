name: Reusable deterministic pre-review

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: Pull request to pre-review
        required: true
        type: string
      base_sha:
        description: Exact pull request base SHA
        required: true
        type: string
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      config_path:
        description: Policy file in the caller repository
        required: false
        default: agentic-sdlc.toml
        type: string
      platform_ref:
        description: Immutable Agentic SDLC commit SHA containing the checker
        required: true
        type: string
      platform_repository:
        description: Agentic SDLC repository in owner/name form
        required: true
        type: string
    secrets:
      PLATFORM_READ_TOKEN:
        required: false

permissions: {}

concurrency:
  group: deterministic-pre-review-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  pre_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate immutable review identity
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLATFORM_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
      - name: Check out exact pull request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact base and head exist
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Check out immutable pre-review engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repository }}
          ref: ${{ inputs.platform_ref }}
          path: .agentic-platform
          persist-credentials: false
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - name: Install deterministic checker dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q ./.agentic-platform
      - name: Run cheap deterministic pre-review
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/forge-pre-review"
          python3 - "$CONFIG_PATH" "$BASE_SHA" "${RUNNER_TEMP}/forge-pre-review/report.json" <<'PY'
          import json
          import pathlib
          import sys

          from agentic_sdlc.pre_review import run_pre_review

          config, base, output = sys.argv[1:]
          report = run_pre_review(config, ".", base)
          pathlib.Path(output).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not report["passed"]:
              for finding in report["findings"]:
                  print(
                      f"::error file={finding['path']}::{finding['code']}: "
                      f"{finding['message']}"
                  )
              raise SystemExit(2)
          PY
      - name: Store deterministic pre-review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-pre-review-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-pre-review/report.json
          if-no-files-found: error
          retention-days: 7
