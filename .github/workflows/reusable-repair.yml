name: Reusable bounded review repair

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: string
      reviewed_head_sha:
        required: true
        type: string
      review_run_id:
        required: true
        type: string
      repair_cycle:
        required: true
        type: number
      max_repair_cycles:
        required: true
        type: number
      config_path:
        required: false
        default: agentic-sdlc.toml
        type: string
      platform_ref:
        required: true
        type: string
      platform_repository:
        required: true
        type: string
      publisher_app_client_id:
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      PLATFORM_READ_TOKEN:
        required: false
      PUBLISHER_APP_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: forge-repair-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - name: Validate bounded repair inputs
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REPAIR_CYCLE: ${{ inputs.repair_cycle }}
          MAX_REPAIR_CYCLES: ${{ inputs.max_repair_cycles }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$REPAIR_CYCLE" =~ ^[1-9][0-9]*$ ]]
          [[ "$MAX_REPAIR_CYCLES" =~ ^[1-9][0-9]*$ ]]
          test "$REPAIR_CYCLE" -le "$MAX_REPAIR_CYCLES"
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLATFORM_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
      - name: Bind repair to current exact same-repository PR head
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.data.state !== 'open' || pr.data.draft) {
              core.setFailed('repair requires an open non-draft pull request');
              return;
            }
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('repair requires a same-repository pull request');
              return;
            }
            if (pr.data.head.sha !== process.env.REVIEWED_HEAD_SHA) {
              core.setFailed('pull request head changed after independent review');
              return;
            }
            core.setOutput('head_ref', pr.data.head.ref);
      - name: Check out exact reviewed head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted consumer policy
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: cp -- "$CONFIG_PATH" "${RUNNER_TEMP}/trusted-policy.toml"
      - name: Check out pinned Forge policy engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repository }}
          ref: ${{ inputs.platform_ref }}
          path: .agentic-platform
          persist-credentials: false
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - name: Restore exact independent review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: independent-review-${{ inputs.review_run_id }}
          path: ${{ runner.temp }}/independent-review
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_run_id }}
      - name: Require changes-requested review and create repair prompt
        env:
          REVIEW_PATH: ${{ runner.temp }}/independent-review/review.json
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPAIR_CYCLE: ${{ inputs.repair_cycle }}
          HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .agentic-input
          python3 - "$REVIEW_PATH" "$PR_NUMBER" "$REPAIR_CYCLE" "$HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          review_path, pr_number, cycle, head_sha = sys.argv[1:]
          review = json.loads(pathlib.Path(review_path).read_text(encoding='utf-8'))
          if review.get('verdict') != 'changes_requested':
              raise SystemExit('bounded repair requires changes_requested review evidence')
          findings = review.get('findings')
          risks = review.get('residualRisks')
          if not isinstance(findings, list) or not isinstance(risks, list):
              raise SystemExit('review artifact is malformed')
          payload = {
              'pullRequest': int(pr_number),
              'reviewedHeadSha': head_sha,
              'repairCycle': int(cycle),
              'findings': findings,
              'residualRisks': risks,
              'summary': str(review.get('summary') or ''),
          }
          pathlib.Path('.agentic-input/review.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('.agentic-input/prompt.md').write_text(
              'Repair only the actionable findings in .agentic-input/review.json.\n'
              'Keep the change minimal. Preserve all existing security and policy gates.\n'
              'Do not push, merge, deploy, access credentials, or place trades.\n'
              'Leave intended edits only in the working tree.\n',
              encoding='utf-8',
          )
          PY
      - name: Store trusted repair input and policy engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-input-${{ github.run_id }}
          path: |
            .agentic-input/
            ${{ runner.temp }}/trusted-policy.toml
            .agentic-platform/src/agentic_sdlc/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  generate_patch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact reviewed head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore trusted repair input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repair-input-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-input
      - name: Stage trusted repair metadata outside proposed diff
        run: |
          set -euo pipefail
          cp -R "${RUNNER_TEMP}/repair-input/.agentic-input" .agentic-input
          mkdir -p .agentic-platform/src
          cp -R "${RUNNER_TEMP}/repair-input/.agentic-platform/src/agentic_sdlc" .agentic-platform/src/
          printf '/.agentic-input/\n/.agentic-output/\n/.agentic-platform/\n' >> .git/info/exclude
          mkdir -p .agentic-output
      - name: Install and verify Claude subprocess isolation
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          command -v bwrap >/dev/null
          command -v socat >/dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true
      - name: Repair reviewed head with Claude Max OAuth
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Read .agentic-input/prompt.md and .agentic-input/review.json, then repair
            only those actionable review findings in the current exact-head checkout.
            Do not push, merge, deploy, access credentials, or place trades.
          claude_args: >-
            --model claude-opus-5
            --max-turns 50
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
      - name: Collect policy-bounded proposed repair
        env:
          BASE_SHA: ${{ inputs.reviewed_head_sha }}
          CONFIG_PATH: ${{ runner.temp }}/repair-input/trusted-policy.toml
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}/.agentic-platform/src"
          python3 -m agentic_sdlc inspect-diff \
            --config "$CONFIG_PATH" \
            --repository . \
            --base "$BASE_SHA" \
            --patch-output .agentic-output/change.patch \
            --paths-output .agentic-output/paths.txt \
            --decision-output .agentic-output/generator-decision.json
          python3 -m agentic_sdlc create-manifest \
            --patch .agentic-output/change.patch \
            --base-sha "$BASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --request-number "$PR_NUMBER" \
            --output .agentic-output/manifest.json
      - name: Store untrusted repair patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-repair-${{ github.run_id }}
          path: .agentic-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  verify:
    needs: [prepare, generate_patch]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore trusted repair input and generated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{repair-input-${{ github.run_id }},generated-repair-${{ github.run_id }}}"
          path: ${{ runner.temp }}/verification-input
          merge-multiple: false
      - name: Apply exact repair artifact and run deterministic gates
        env:
          BASE_SHA: ${{ inputs.reviewed_head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          policy_root="${RUNNER_TEMP}/verification-input/repair-input-${GITHUB_RUN_ID}"
          patch_root="${RUNNER_TEMP}/verification-input/generated-repair-${GITHUB_RUN_ID}"
          mkdir -p .agentic-platform/src
          cp -R "$policy_root/.agentic-platform/src/agentic_sdlc" .agentic-platform/src/
          printf '/.agentic-platform/\n' >> .git/info/exclude
          export PYTHONPATH="${GITHUB_WORKSPACE}/.agentic-platform/src"
          python3 -m agentic_sdlc verify-artifact \
            --patch "$patch_root/change.patch" \
            --manifest "$patch_root/manifest.json" \
            --base-sha "$BASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --request-number "$PR_NUMBER"
          git apply --check "$patch_root/change.patch"
          git apply --index "$patch_root/change.patch"
          mkdir -p "${RUNNER_TEMP}/pre-gate-policy"
          python3 -m agentic_sdlc inspect-diff \
            --config "$policy_root/trusted-policy.toml" \
            --repository . \
            --base "$BASE_SHA" \
            --patch-output "${RUNNER_TEMP}/pre-gate-policy/change.patch" \
            --paths-output "${RUNNER_TEMP}/pre-gate-policy/paths.txt" \
            --decision-output "${RUNNER_TEMP}/pre-gate-policy/decision.json"
          git config user.name "agentic-sdlc-verifier"
          git config user.email "agentic-sdlc-verifier@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git commit -m "Forge repair verification snapshot"
          python3 -m agentic_sdlc run-gates \
            --config "$policy_root/trusted-policy.toml" \
            --repository . \
            --output "${RUNNER_TEMP}/verification-report.json"
      - name: Reconstruct attested repair without executing consumer code
        env:
          BASE_SHA: ${{ inputs.reviewed_head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          policy_root="${RUNNER_TEMP}/verification-input/repair-input-${GITHUB_RUN_ID}"
          patch_root="${RUNNER_TEMP}/verification-input/generated-repair-${GITHUB_RUN_ID}"
          git reset --hard "$BASE_SHA"
          git apply --check "$patch_root/change.patch"
          git apply --index "$patch_root/change.patch"
          mkdir -p "${RUNNER_TEMP}/verified-repair"
          export PYTHONPATH="${GITHUB_WORKSPACE}/.agentic-platform/src"
          python3 -m agentic_sdlc inspect-diff \
            --config "$policy_root/trusted-policy.toml" \
            --repository . \
            --base "$BASE_SHA" \
            --patch-output "${RUNNER_TEMP}/verified-repair/change.patch" \
            --paths-output "${RUNNER_TEMP}/verified-repair/paths.txt" \
            --decision-output "${RUNNER_TEMP}/verified-repair/decision.json"
          python3 -m agentic_sdlc create-manifest \
            --patch "${RUNNER_TEMP}/verified-repair/change.patch" \
            --base-sha "$BASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --request-number "$PR_NUMBER" \
            --output "${RUNNER_TEMP}/verified-repair/manifest.json"
      - name: Store verified repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-repair/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create short-lived repository publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.publisher_app_client_id }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Rebind exact PR head immediately before publication
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        with:
          github-token: ${{ steps.publisher-token.outputs.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.data.state !== 'open' || pr.data.draft) {
              core.setFailed('repair publication requires an open non-draft PR');
              return;
            }
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.data.head.sha !== process.env.REVIEWED_HEAD_SHA) {
              core.setFailed('PR head changed before repair publication');
              return;
            }
            core.setOutput('head_ref', pr.data.head.ref);
      - name: Check out exact reviewed head with publisher credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 0
          token: ${{ steps.publisher-token.outputs.token }}
      - name: Restore verified repair only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-repair
      - name: Apply verified repair and fast-forward PR branch
        env:
          BASE_SHA: ${{ inputs.reviewed_head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPAIR_CYCLE: ${{ inputs.repair_cycle }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PATCH_PATH: ${{ runner.temp }}/verified-repair/change.patch
          MANIFEST_PATH: ${{ runner.temp }}/verified-repair/manifest.json
        run: |
          set -euo pipefail
          python3 - "$PATCH_PATH" "$MANIFEST_PATH" "$BASE_SHA" "$GITHUB_REPOSITORY" "$PR_NUMBER" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          patch_path, manifest_path, base_sha, repository, pr_number = sys.argv[1:]
          patch = pathlib.Path(patch_path).read_bytes()
          manifest = json.loads(pathlib.Path(manifest_path).read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 1,
              'baseSha': base_sha,
              'repository': repository,
              'requestNumber': int(pr_number),
              'patchBytes': len(patch),
              'patchSha256': hashlib.sha256(patch).hexdigest(),
          }
          if any(manifest.get(key) != value for key, value in expected.items()):
              raise SystemExit('verified repair manifest mismatch')
          PY
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config user.name "agentic-sdlc[bot]"
          git config user.email "agentic-sdlc[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git apply --check "$PATCH_PATH"
          git apply --index "$PATCH_PATH"
          git commit -m "Repair PR #${PR_NUMBER} after review (cycle ${REPAIR_CYCLE})"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
