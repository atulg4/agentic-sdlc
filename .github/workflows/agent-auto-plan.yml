name: Automatic agent plan

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  plan:
    if: >-
      github.event.label.name == 'agent-ready' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent-ready') &&
      contains(github.event.issue.labels.*.name, 'human-review-required')
    permissions:
      contents: read
      issues: write
    uses: atulg4/agentic-sdlc/.github/workflows/reusable-plan.yml@3d6ec84dfa3e286315c4637110902ba73dea1630
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: 3d6ec84dfa3e286315c4637110902ba73dea1630
      platform_repository: atulg4/agentic-sdlc
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
