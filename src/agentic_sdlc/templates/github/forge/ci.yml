name: CI

on:
  pull_request:
  push:
    branches: [DEFAULT_BRANCH]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: CI_RUNS_ON_YAML
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up virtualenv
        run: |
          set -euo pipefail
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Setup
        run: SETUP_COMMAND
      - name: Quality
        run: QUALITY_COMMAND
      - name: Test
        run: TEST_COMMAND
