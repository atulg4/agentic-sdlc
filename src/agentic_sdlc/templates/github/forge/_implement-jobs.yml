  preflight:
    runs-on: RUNS_ON_YAML
    permissions: {}
    steps:
      - name: Require implementation credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_MODEL_FLASH: ${{ vars.DEEPSEEK_MODEL_FLASH }}
          DEEPSEEK_MODEL_PRO: ${{ vars.DEEPSEEK_MODEL_PRO }}
          PUBLISHER_APP_CLIENT_ID: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHER_APP_CLIENT_ID"
          test -n "$PUBLISHER_APP_PRIVATE_KEY"
PREFLIGHT_EXTRA
  implement:
    needs: preflight
    permissions:
      contents: write
      issues: read
      pull-requests: read
      id-token: write
    uses: REUSABLE_IMPLEMENT_USES
    with:
      runs_on: RUNS_ON_JSON
      issue_number: ISSUE_NUMBER_EXPR
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
      publisher_app_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
      agent: AGENT
      claude_auth_mode: subscription_oauth
      executor_registry_path: EXECUTOR_REGISTRY_PATH
      routing_policy_path: ROUTING_POLICY_PATH
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
      PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

  notify_failure:
    needs: [preflight, implement]
    if: >-
      ${{ always() &&
      (needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled' ||
       needs.implement.result == 'failure' || needs.implement.result == 'cancelled') }}
    runs-on: RUNS_ON_YAML
    permissions:
      issues: write
    steps:
      - name: Report implementation failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ISSUE_NUMBER_EXPR
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Agent implementation did not complete. Inspect the bounded run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
