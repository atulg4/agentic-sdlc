    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Codex 4240028941: naming any permission sets the rest to none, and listing the issue's
    # label events needs `issues: read` in a private repository (the collaborator-permission
    # reads need only the implicit metadata scope). Nothing broader.
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      approver: ${{ steps.authorize.outputs.approver }}
    steps:
      - name: Require repository write authority from the labeler and the approver
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVAL_LABEL: APPROVAL_LABEL_VALUE
          REQUIRED_LABELS: REQUIRED_LABELS_VALUE
        run: |
          set -euo pipefail
          # Only a DEFINITIVE answer decides: HTTP 200 with a permission field, or 404 (not a
          # collaborator). Anything else (rate limit, 5xx, network) is retried, then FAILS the
          # job: never read as "unauthorized", which would silently consume the label event.
          authorized=true
          errors="$(mktemp)"
          # Codex 4239965189: the event's sender is not necessarily who APPROVED. A Triage user can
          # apply the approval label first and a writer the last prerequisite label later; so the
          # label events are read (every page) and whoever applied APPROVAL_LABEL most recently
          # must ALSO hold write authority. Codex 4240421144: and so must whoever applied EACH
          # label of the set (REQUIRED_LABELS, a JSON list) most recently -- the same rule as
          # `sdlcctl authorize-labeler`. History that cannot be read, or that never shows a label
          # applied, FAILS the job; a label removed since it was last applied is unauthorized.
          approver=""
          labelers=""
          removed=false
          for attempt in 1 2 3; do
            removed=false
            approver=""
            labelers=""
            if events="$(gh api --method GET --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" or .event == "unlabeled")
                | {event, name: .label.name, login: .actor.login}' 2>"$errors")" &&
              latest="$(jq -sc --argjson labels "$REQUIRED_LABELS" '
                if any(.[]; (.name | type) != "string") then error("a label event names no label")
                else . as $events | [$labels[] as $label
                  | ([$events[] | select((.name | ascii_downcase) == ($label | ascii_downcase))]
                    | last) // {event: "none", name: $label}]
                end' <<<"$events" 2>"$errors")"; then
              if jq -e 'any(.[]; .event == "unlabeled")' <<<"$latest" >/dev/null; then
                removed=true
                printf '::warning::attempt %s: an approval label was removed after it was last applied\n' \
                  "$attempt"
              elif jq -e 'any(.[]; .event != "labeled")' <<<"$latest" >/dev/null; then
                printf '::warning::attempt %s: no labeled event for every approval label yet\n' \
                  "$attempt"
              else
                labelers="$(jq -r '.[] | .login | if type == "string" then . else "" end' \
                  <<<"$latest")"
                valid=true
                while IFS= read -r login; do
                  if ! [[ "$login" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(\[bot\])?$ ]]; then
                    valid=false
                  fi
                done <<<"$labelers"
                if [ "$valid" = true ]; then
                  approver="$(jq -r --arg label "$APPROVAL_LABEL" '[.[]
                    | select((.name | ascii_downcase) == ($label | ascii_downcase))]
                    | (first // {}) | .login // ""' <<<"$latest")"
                  if [[ "$approver" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(\[bot\])?$ ]]; then
                    break
                  fi
                fi
                approver=""
                labelers=""
                printf '::warning::attempt %s: a latest approval-label event names no valid actor\n' \
                  "$attempt"
              fi
            else
              printf '::warning::attempt %s: could not read the label events of issue #%s: %s\n' \
                "$attempt" "$ISSUE_NUMBER" "$(head -c 300 "$errors" | tr '\n' ' ')"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if [ "$removed" = true ]; then
            printf 'authorized=false\napprover=\n' >> "$GITHUB_OUTPUT"
            printf '::notice::AUTHORIZED_WORK not scheduled: an approval label was removed.\n'
            exit 0
          fi
          if [ -z "$approver" ]; then
            printf '::error::Could not determine who applied each of %s to issue #%s; failing instead of authorizing. Re-run this job or re-apply the labels.\n' \
              "$REQUIRED_LABELS" "$ISSUE_NUMBER"
            exit 1
          fi
          mapfile -t logins <<<"$labelers"
          for login in "$SENDER" "$ACTOR" "${logins[@]}"; do
            encoded="$(jq -rn --arg login "$login" '$login | @uri')"
            permission=""
            for attempt in 1 2 3; do
              if body="$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/collaborators/${encoded}/permission" 2>"$errors")"; then
                permission="$(jq -r '.permission // empty | strings' <<<"$body" 2>/dev/null || true)"
                if [ -n "$permission" ]; then
                  break
                fi
                printf '::warning::attempt %s: no permission field in the answer for %s\n' "$attempt" "$login"
              elif grep -q '(HTTP 404)' "$errors"; then
                permission=none
                break
              else
                printf '::warning::attempt %s: could not read the permission of %s: %s\n' \
                  "$attempt" "$login" "$(head -c 300 "$errors" | tr '\n' ' ')"
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 10))"
              fi
            done
            if [ -z "$permission" ]; then
              printf '::error::Could not read the repository permission of %s; failing instead of treating the labeler as unauthorized. Re-run this job or re-apply the label.\n' "$login"
              exit 1
            fi
            case "$permission" in
              admin|write) ;;
              *) authorized=false ;;
            esac
          done
          printf 'authorized=%s\napprover=%s\n' "$authorized" "$approver" >> "$GITHUB_OUTPUT"
          if [ "$authorized" != true ]; then
            printf '::notice::AUTHORIZED_WORK not scheduled: the labeler lacks repository write authority.\n'
          fi
