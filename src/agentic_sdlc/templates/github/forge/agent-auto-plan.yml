name: Automatic planning

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: forge-auto-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event.label.name == 'READY_LABEL' || github.event.label.name == 'human-review-required') &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'READY_LABEL') &&
      contains(github.event.issue.labels.*.name, 'human-review-required') &&
      !contains(github.event.issue.labels.*.name, 'implementation-approved')
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-plan.yml@PLATFORM_COMMIT_SHA
    with:
      runs_on: 'RUNS_ON_JSON'
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
