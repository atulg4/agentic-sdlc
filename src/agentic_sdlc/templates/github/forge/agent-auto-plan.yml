name: Automatic planning

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: forge-auto-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Anyone may open the work-request issue template, which applies the planning labels itself.
  # The labeler's write authority is therefore checked HERE, on a GitHub-hosted runner, before
  # any job is scheduled on RUNS_ON: an outsider's issue must not occupy a self-hosted runner
  # (the reusable workflow checks again; this check only keeps unauthorized runs off it).
  # Not tunable: doctor requires this job, its runner and the `plan` gate exactly as generated.
  preflight:
    # Only the ready label triggers. An issue opened with both labels fires one `labeled` run per
    # label, and both would see both labels and plan twice; the other is required, not a trigger.
    if: AUTO_PLAN_IF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - name: Require repository write authority from the labeler
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          authorized=true
          for login in "$SENDER" "$ACTOR"; do
            encoded="$(jq -rn --arg login "$login" '$login | @uri')"
            permission="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/collaborators/${encoded}/permission" \
              --jq '.permission' 2>/dev/null)" || permission=none
            case "$permission" in
              admin|write) ;;
              *) authorized=false ;;
            esac
          done
          printf 'authorized=%s\n' "$authorized" >> "$GITHUB_OUTPUT"
          if [ "$authorized" != true ]; then
            printf '::notice::Planning not scheduled: the labeler lacks repository write authority.\n'
          fi

  plan:
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: REUSABLE_PLAN_USES
    with:
      runs_on: RUNS_ON_JSON
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}

  notify_failure:
    needs: [plan]
    if: >-
      ${{ always() &&
      (needs.plan.result == 'failure' || needs.plan.result == 'cancelled') }}
    runs-on: RUNS_ON_YAML
    permissions:
      issues: write
    steps:
      - name: Report planning failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Agent planning did not complete. Inspect the bounded run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
