name: Agent implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved GitHub issue number
        required: true
        type: string
      agent:
        description: Patch generator
        required: true
        default: codex
        type: choice
        options: [codex, claude, route]
      claude_auth_mode:
        description: Claude authentication mode
        required: false
        default: subscription_oauth
        type: choice
        options: [subscription_oauth, direct_api]
      executor_registry_path:
        description: Optional executor registry JSON
        required: false
        default: ""
        type: string
      routing_policy_path:
        description: Optional routing policy JSON
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  implement:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-implement.yml@PLATFORM_COMMIT_SHA
    with:
      issue_number: ${{ inputs.issue_number }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
      publisher_app_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
      agent: ${{ inputs.agent }}
      claude_auth_mode: ${{ inputs.claude_auth_mode }}
      executor_registry_path: ${{ inputs.executor_registry_path }}
      routing_policy_path: ${{ inputs.routing_policy_path }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
      PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
