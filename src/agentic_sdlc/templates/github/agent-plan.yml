name: Agent plan

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
        type: string

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
      issues: write
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-plan.yml@PLATFORM_COMMIT_SHA
    with:
      issue_number: ${{ inputs.issue_number }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
