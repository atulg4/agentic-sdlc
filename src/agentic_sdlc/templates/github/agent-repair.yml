name: Forge bounded repair

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      review_run_id:
        required: true
        type: string
      repair_cycle:
        required: true
        type: string

permissions: {}

concurrency:
  group: forge-repair-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  auth_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Claude Max OAuth and isolated publisher credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PUBLISHER_APP_CLIENT_ID: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          test -n "$PUBLISHER_APP_CLIENT_ID"
          test -n "$PUBLISHER_APP_PRIVATE_KEY"

  repair:
    needs: auth_preflight
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: read
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-repair.yml@PLATFORM_COMMIT_SHA
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      review_run_id: ${{ inputs.review_run_id }}
      repair_cycle: ${{ fromJSON(inputs.repair_cycle) }}
      max_repair_cycles: 3
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
      publisher_app_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
      PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
