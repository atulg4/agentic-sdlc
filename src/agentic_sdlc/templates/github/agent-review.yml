name: Independent agent review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: independent-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review_eligibility:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Bind successful CI run to exact open same-repository PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          base_sha="$(jq -r '.base.sha' <<< "$pr")"
          test "$state" = open
          test "$draft" = false
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_sha" = "$RUN_HEAD_SHA"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'number=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$PR_NUMBER" "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

  deterministic_pre_review:
    needs: review_eligibility
    permissions:
      contents: read
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-pre-review.yml@PLATFORM_COMMIT_SHA
    with:
      pull_request_number: ${{ needs.review_eligibility.outputs.pull_request_number }}
      base_sha: ${{ needs.review_eligibility.outputs.base_sha }}
      head_sha: ${{ needs.review_eligibility.outputs.head_sha }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
    secrets:
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}

  review:
    needs: [review_eligibility, deterministic_pre_review]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-review.yml@PLATFORM_COMMIT_SHA
    with:
      pull_request_number: ${{ needs.review_eligibility.outputs.pull_request_number }}
      base_sha: ${{ needs.review_eligibility.outputs.base_sha }}
      head_sha: ${{ needs.review_eligibility.outputs.head_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
