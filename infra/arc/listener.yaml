# gha-runner-scale-set 0.14.2. The name must be listener, not a sidecar.
minRunners: 0
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 100Mi
          limits:
            memory: 256Mi
            ephemeral-storage: 1Gi
