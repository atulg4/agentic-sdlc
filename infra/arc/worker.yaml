# GKE Sandbox preserves the host boundary while permitting nested agent sandboxes.
# Apply only after the credential-free smoke test passes on the target cluster.
template:
  spec:
    runtimeClassName: gvisor
    nodeSelector:
      cloud.google.com/compute-class: Balanced
    automountServiceAccountToken: false
    containers:
      - name: runner
        image: gcr.io/marketmaestro-463502/forge-runner@sha256:fab30ce988fbc67d156fc8898bda67880a9f49573da5d729aaa1e3188f97ef2b
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 8Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 8Gi
