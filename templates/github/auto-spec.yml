name: Forge spec stage

# Drafts the intake-contract sections (Summary, Acceptance Criteria, Required
# Tests, Non-Goals, Dependencies) that a filed issue is missing. Drafts are
# appended under a "Drafted by Forge spec stage — owner review required"
# marker and the issue is labelled `spec-drafted`; implementation stays
# blocked until a maintainer removes that label or adds `spec-approved`.

on:
  issues:
    types: [opened, edited, labeled]

permissions: {}

jobs:
  spec:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'spec-drafted')
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: PLATFORM_REPOSITORY/.github/workflows/reusable-spec.yml@PLATFORM_COMMIT_SHA
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: PLATFORM_COMMIT_SHA
      platform_repository: PLATFORM_REPOSITORY
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
