[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Provider-neutral policy and orchestration primitives for agent-driven SDLC workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<1",
]

[project.scripts]
sdlcctl = "agentic_sdlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_sdlc = ["templates/*.md", "templates/github/*.yml", "templates/gitlab/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
